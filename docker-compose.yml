services:
  pii-harness:
    build:
      context: .
      args:
        NER_BACKEND: ${NER_BACKEND:-gliner}
        NER_MODEL: ${NER_MODEL:-urchade/gliner_multi_pii-v1}
    image: pii-harness:latest
    container_name: pii-harness
    ports:
      - "8000:8000"
    environment:
      - UPSTREAM_OPENAI_URL=${UPSTREAM_OPENAI_URL:-${UPSTREAM_BASE_URL:-https://api.openai.com/v1}}
      - UPSTREAM_API_KEY=${UPSTREAM_API_KEY:-}
      - UPSTREAM_GEMINI_URL=${UPSTREAM_GEMINI_URL:-https://generativelanguage.googleapis.com}
      - UPSTREAM_CODE_ASSIST_URL=${UPSTREAM_CODE_ASSIST_URL:-https://daily-cloudcode-pa.googleapis.com}
      - VAULT_HMAC_SECRET=${VAULT_HMAC_SECRET:-change-me-in-prod-hmac-key}
      - CUSTOM_REDACT_TERMS=${CUSTOM_REDACT_TERMS:-}
      - VAULT_FALLBACK_SESSION=${VAULT_FALLBACK_SESSION:-}
      - DB_PATH=/data/vault.db
      - MOCK_UPSTREAM=${MOCK_UPSTREAM:-false}
      - NER_BACKEND=${NER_BACKEND:-gliner}
      - NER_MODEL=${NER_MODEL:-urchade/gliner_multi_pii-v1}
      - NER_LABELS=${NER_LABELS:-person:PERSON,school:SCHOOL,university:SCHOOL}
      - NER_THRESHOLD=${NER_THRESHOLD:-0.5}
      - NER_IGNORE=${NER_IGNORE:-}
    volumes:
      # Must be writable by UID 1000 (the container's non-root "harness" user).
      - ./data:/data
    restart: unless-stopped
